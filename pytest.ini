# pytest configuration file for crypto trading algorithm tests

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test* *Test

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests between modules
    system: System-level end-to-end tests
    stress: Stress and performance tests
    mathematical: Mathematical validation tests
    live: Live testnet validation tests (requires API credentials)
    slow: Tests that take longer to run
    portfolio: Portfolio management related tests
    risk: Risk management and calculation tests
    execution: Trade execution and order management tests
    data: Data processing and fetching tests
    algorithm: Algorithm engine and strategy tests
    production: Production environment validation tests

# Minimum version
minversion = 6.0

# Add options
addopts = 
    -v
    --strict-markers
    --tb=short
    --durations=10
    --color=yes
    --showlocals

# Test timeout (in seconds)
timeout = 300

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# Coverage (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=execution --cov=algorithm --cov=data --cov-report=html --cov-report=term-missing

# Parallel execution (if pytest-xdist is installed)
# Uncomment to enable parallel test execution
# addopts = -n auto
